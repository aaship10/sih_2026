[pytest]
markers =
    matlab_parity: requires a working MATLAB Engine + Simulink/Stateflow install (slow: engine startup alone costs 10-30s). Excluded from the default run -- invoke explicitly with `-m matlab_parity` (or `pytest tests/test_fsm_stateflow_parity.py -m matlab_parity`).
addopts = -m "not matlab_parity"
